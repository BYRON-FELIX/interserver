{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset your password — InterServer</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-page">
<div class="login-shell">
    <div class="login-card">
        <div class="login-brand">
            <div class="brand-mark">IS</div>
            <span class="brand-name">InterServer</span>
        </div>

        <h1 class="login-heading">Reset your password</h1>
        <p class="login-sub">Enter the email on your account and we'll send a reset link.</p>

        {% if form.errors %}
            <div class="login-error">
                Please enter a valid email address.
            </div>
        {% endif %}

        <form method="post" class="login-form">
            {% csrf_token %}

            <label class="login-label" for="id_email">Email address</label>
            <input
                type="email"
                name="email"
                id="id_email"
                class="login-input"
                autocomplete="email"
                required
            >

            <button type="submit" class="login-btn">Send reset link</button>
        </form>

        <p class="login-footer">
            <a href="{% url 'login' %}" class="link-inline">← Back to sign in</a>
        </p>
    </div>
</div>
</body>
</html>

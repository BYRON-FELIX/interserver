{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check your inbox — InterServer</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-page">
<div class="login-shell">
    <div class="login-card login-card-center">
        <div class="login-brand login-brand-center">
            <div class="brand-mark">IS</div>
            <span class="brand-name">InterServer</span>
        </div>

        <div class="logged-out-icon">✉</div>

        <h1 class="login-heading">Check your inbox</h1>
        <p class="login-sub">
            If an account exists for that email, we've sent a link to reset
            your password.
        </p>

        <a href="{% url 'login' %}" class="login-btn login-btn-block">
            Back to sign in
        </a>
    </div>
</div>
</body>
</html>
